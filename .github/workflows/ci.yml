name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run a check by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version Vercel runs these functions on.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Smoke tests
        run: npm test
