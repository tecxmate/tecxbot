<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tecxmate</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #14213d;
        --muted: #5d6678;
        --bg: #fbfcfe;
        --panel: #ffffff;
        --line: #d9e0ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e9edf5;
          --muted: #98a2b6;
          --bg: #0e1117;
          --panel: #161b22;
          --line: #2a313c;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 40px 32px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/tecxmate-mark.svg" alt="Tecxmate" />
      <h1>Tecxmate</h1>
      <p>This is a private service. There's nothing to see here.</p>
    </main>
  </body>
</html>
