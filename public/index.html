<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tecxbot</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #17202a;
        background: #f6f7f9;
      }
      main {
        width: min(560px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid #d9dee5;
        border-radius: 8px;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #eef1f5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tecxbot</h1>
      <p>Bot API is running. LINE webhook endpoint: <code>/api/line-webhook</code></p>
    </main>
  </body>
</html>
