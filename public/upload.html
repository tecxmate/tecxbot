<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload audio · Speech-to-text</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: #94a3b8; font-size: 14px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 16px 0 6px; }
    select, input[type=file] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 15px; }
    button { width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 10px; background: #6366f1; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 18px; font-size: 14px; min-height: 20px; }
    .status.error { color: #f87171; }
    .status.ok { color: #4ade80; }
    .bar { margin-top: 12px; height: 6px; background: #334155; border-radius: 999px; overflow: hidden; display: none; }
    .bar > div { height: 100%; width: 0%; background: #6366f1; transition: width 0.2s; }
    pre { margin-top: 16px; padding: 12px; background: #0f172a; border-radius: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙️ Audio → Text</h1>
    <p class="sub">上傳檔案，轉好的文字會自動傳回你的 Telegram 對話。<br />Upload a file; the transcript is sent back to your Telegram chat.</p>

    <label for="language">語言 / Language</label>
    <select id="language">
      <option value="zh-TW">中文 (zh-TW)</option>
      <option value="en">English</option>
      <option value="auto">自動 Auto / Multi</option>
    </select>

    <label for="file">音檔或影片 / Audio or video file</label>
    <input type="file" id="file" accept="audio/*,video/*" />

    <button id="go">轉錄並傳回 Telegram / Transcribe</button>
    <div class="bar" id="bar"><div></div></div>
    <div class="status" id="status"></div>
    <pre id="result"></pre>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const bar = document.getElementById('bar');
    const barFill = bar.querySelector('div');
    const goBtn = document.getElementById('go');

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    if (!token) {
      setStatus('連結無效或已過期，請回 Telegram 重新傳檔案。 Invalid link, please resend the file in Telegram.', 'error');
      goBtn.disabled = true;
    }

    function deepgramContentType(file) {
      const t = (file.type || '').toLowerCase();
      if (t) return t;
      const name = file.name.toLowerCase();
      if (name.endsWith('.mp3')) return 'audio/mpeg';
      if (name.endsWith('.wav')) return 'audio/wav';
      if (name.endsWith('.m4a') || name.endsWith('.mp4')) return 'audio/mp4';
      if (name.endsWith('.webm')) return 'audio/webm';
      return 'application/octet-stream';
    }

    // Upload with progress via XHR so the user sees the (potentially large) upload move.
    function postWithProgress(url, headers, body) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url);
        for (const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, v);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) barFill.style.width = Math.round((e.loaded / e.total) * 100) + '%';
        };
        xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve(xhr.responseText) : reject(new Error(`${xhr.status} ${xhr.responseText}`));
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.send(body);
      });
    }

    goBtn.addEventListener('click', async () => {
      const file = document.getElementById('file').files[0];
      const language = document.getElementById('language').value;
      if (!file) return setStatus('請先選擇檔案。 Please choose a file.', 'error');

      goBtn.disabled = true;
      resultEl.style.display = 'none';
      bar.style.display = 'block';
      barFill.style.width = '0%';

      try {
        setStatus('取得轉錄金鑰… Getting token…');
        const tokenRes = await fetch('/api/deepgram-token', { method: 'POST' });
        if (!tokenRes.ok) throw new Error('Token mint failed: ' + (await tokenRes.text()));
        const { key } = await tokenRes.json();

        setStatus('上傳並轉錄中… Uploading & transcribing…');
        const dgParams = new URLSearchParams({ model: 'nova-3', punctuate: 'true', smart_format: 'true' });
        dgParams.set('language', language === 'auto' ? 'multi' : language);
        const dgText = await postWithProgress(
          'https://api.deepgram.com/v1/listen?' + dgParams.toString(),
          { Authorization: 'Token ' + key, 'Content-Type': deepgramContentType(file) },
          file
        );
        const dg = JSON.parse(dgText);
        const transcript = (dg.results?.channels?.[0]?.alternatives?.[0]?.transcript || '').trim();
        if (!transcript) throw new Error('沒有偵測到語音內容。 No speech detected.');

        resultEl.textContent = transcript;
        resultEl.style.display = 'block';

        setStatus('傳回 Telegram… Delivering…');
        const deliverRes = await fetch('/api/telegram-deliver', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, text: transcript }),
        });
        if (!deliverRes.ok) throw new Error('Delivery failed: ' + (await deliverRes.text()));

        setStatus('✅ 已傳回 Telegram，可關閉此頁。 Sent to Telegram — you can close this page.', 'ok');
      } catch (err) {
        setStatus((err && err.message) ? err.message : 'Failed', 'error');
      } finally {
        bar.style.display = 'none';
        goBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
